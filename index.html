<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar Digital — SMP Al-Irsyad Bogor</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" type="image/png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: -1;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loading-screen">
        <div class="spinner"></div>
        <div style="color: #94a3b8; font-size: 14px;">Memuat Jurnal Mengajar...</div>
    </div>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbwBclyQ49AqarV5EoCMW4bgG4dl-MwEpwXi7rn8V2Cv8COuwJzaB6geVrd2dqIY1ZnWLA/exec?authuser=0" 
        title="Jurnal Mengajar Digital" 
        allow="camera; microphone; fullscreen"
    ></iframe>

</body>
</html>
