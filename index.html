<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar Digital — SMP Al-Irsyad Bogor</title>
    <meta name="description" content="Aplikasi Jurnal Mengajar Digital untuk guru SMP Al-Irsyad Bogor." />
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" type="image/png" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%; width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
        }

        .loading-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            z-index: 100;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loading-screen.fade-out { opacity: 0; visibility: hidden; }

        .logo-wrap {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 60px rgba(99,102,241,0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .logo-wrap svg { width: 44px; height: 44px; fill: white; }

        .title { color: #fff; font-size: 20px; font-weight: 700; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 13px; text-align: center; margin-top: -10px; }

        .bar-wrap { width: 180px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
        .bar { height: 100%; width: 40%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 99px; animation: slide 1.5s ease-in-out infinite; }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

        iframe {
            position: fixed; inset: 0; width: 100%; height: 100%;
            border: none; opacity: 0;
            transition: opacity 0.5s ease;
        }
        iframe.loaded { opacity: 1; }
    </style>
</head>
<body>

    <div class="loading-screen" id="loading-screen">
        <div class="logo-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <div class="title">Jurnal Mengajar Digital</div>
        <div class="subtitle">SMP Al-Irsyad Bogor</div>
        <div class="bar-wrap"><div class="bar"></div></div>
        <div style="color:#64748b; font-size:13px;">Memuat aplikasi...</div>
    </div>

    <iframe
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbwBclyQ49AqarV5EoCMW4bgG4dl-MwEpwXi7rn8V2Cv8COuwJzaB6geVrd2dqIY1ZnWLA/exec"
        title="Jurnal Mengajar Digital"
        allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
        onload="onLoaded()"
    ></iframe>

    <script>
        function onLoaded() {
            document.getElementById('app-frame').classList.add('loaded');
            setTimeout(() => {
                const s = document.getElementById('loading-screen');
                if (s) { s.classList.add('fade-out'); setTimeout(() => s.remove(), 650); }
            }, 500);
        }
        setTimeout(onLoaded, 8000);
    </script>
</body>
</html>
