<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar Digital — SMP Al-Irsyad Bogor</title>
    <meta name="description" content="Aplikasi Jurnal Mengajar Digital untuk guru SMP Al-Irsyad Bogor. Kelola jurnal mengajar, kehadiran siswa, dan penilaian secara digital." />
    <meta name="author" content="SMP Al-Irsyad Bogor" />

    <!-- Open Graph (untuk preview link di WhatsApp/sosmed) -->
    <meta property="og:title" content="Jurnal Mengajar Digital — SMP Al-Irsyad Bogor" />
    <meta property="og:description" content="Aplikasi pencatatan jurnal mengajar, kehadiran, dan penilaian guru SMP Al-Irsyad Bogor." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" type="image/png" />

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
        }

        /* ─── LOADING SCREEN ─── */
        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            z-index: 100;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Logo container */
        .loading-logo-wrap {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);
            animation: pulse-logo 2s ease-in-out infinite;
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4); }
            50%       { transform: scale(1.05); box-shadow: 0 25px 80px rgba(99, 102, 241, 0.6); }
        }

        .loading-logo-wrap svg {
            width: 48px;
            height: 48px;
            fill: white;
        }

        /* Teks judul */
        .loading-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            text-align: center;
        }

        .loading-subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 400;
            text-align: center;
            margin-top: -12px;
        }

        /* Progress bar */
        .loading-bar-wrap {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #6366f1, #a855f7);
            border-radius: 99px;
            animation: loading-progress 2.5s ease-in-out forwards;
        }

        @keyframes loading-progress {
            0%   { width: 0%; }
            40%  { width: 60%; }
            70%  { width: 80%; }
            100% { width: 100%; }
        }

        .loading-text {
            color: #64748b;
            font-size: 12px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        /* ─── IFRAME ─── */
        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        iframe.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-logo-wrap">
            <!-- Ikon Buku -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15H9V8h2v9zm4 0h-2V8h2v9z"/>
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7 17V7l10 5-10 5z"/>
            </svg>
        </div>
        <h1 class="loading-title">Jurnal Mengajar Digital</h1>
        <p class="loading-subtitle">SMP Al-Irsyad Bogor</p>
        <div class="loading-bar-wrap">
            <div class="loading-bar-fill"></div>
        </div>
        <span class="loading-text">Memuat aplikasi...</span>
    </div>

    <!--
      ╔══════════════════════════════════════════════════════════╗
      ║  PENTING — KONFIGURASI URL                               ║
      ║  Ganti URL src di bawah dengan URL Web App GAS Anda.    ║
      ║  URL harus berakhiran /exec (bukan /dev).                ║
      ║  Contoh:                                                 ║
      ║  https://script.google.com/macros/s/XXXXX.../exec        ║
      ╚══════════════════════════════════════════════════════════╝
    -->
    <iframe
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbwBclyQ49AqarV5EoCMW4bgG4dl-MwEpwXi7rn8V2Cv8COuwJzaB6geVrd2dqIY1ZnWLA/exec?authuser=0"
        title="Jurnal Mengajar Digital — SMP Al-Irsyad Bogor"
        allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
        onload="onAppLoaded()"
    ></iframe>

    <script>
        function onAppLoaded() {
            const frame   = document.getElementById('app-frame');
            const loading = document.getElementById('loading-screen');

            // Tampilkan iframe
            frame.classList.add('loaded');

            // Sembunyikan loading screen dengan animasi fade
            setTimeout(() => {
                loading.classList.add('fade-out');
                // Hapus dari DOM setelah animasi selesai
                setTimeout(() => loading.remove(), 650);
            }, 600);
        }

        // Fallback: Sembunyikan loading setelah 6 detik jika onload tidak terpanggil
        setTimeout(() => {
            const loading = document.getElementById('loading-screen');
            if (loading) {
                onAppLoaded();
            }
        }, 6000);
    </script>

</body>
</html>
